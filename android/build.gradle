buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Pinned to the exact AGP version already present in the WSL Gradle cache
        // (the EasyTier fork APK used the same one), so the build works offline.
        classpath 'com.android.tools.build:gradle:8.3.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
